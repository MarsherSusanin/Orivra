name: Orivra Web2Json
description: Replay an Orivra bundle on pull requests or run Coston2 in merge queue.
inputs:
  manifest:
    description: Path to a Web2JsonManifestV1 JSON file.
    required: true
  mode:
    description: replay, wallet, relayer, or live-coston2.
    required: false
  bundle:
    description: Path to the canonical ProofBundleV1 used for local pull-request replay.
    required: false
    default: fixtures/proofline.bundle.json
runs:
  using: node20
  main: dist/index.js
