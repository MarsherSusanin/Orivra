x-service-defaults: &service-defaults
  platform: linux/amd64
  pull_policy: never
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"
  stop_grace_period: 20s
  pids_limit: 256
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 768M
        pids: 256

services:
  caddy:
    <<: *service-defaults
    image: ${PROOFLINE_CADDY_IMAGE:?PROOFLINE_CADDY_IMAGE is required}
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      PROOFLINE_PUBLIC_ORIGIN: ${PROOFLINE_PUBLIC_ORIGIN:?PROOFLINE_PUBLIC_ORIGIN is required}
    depends_on:
      web:
        condition: service_started
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    networks:
      - public_edge
      - web_internal
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  web:
    <<: *service-defaults
    image: ${PROOFLINE_WEB_IMAGE:?PROOFLINE_WEB_IMAGE is required}
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    expose:
      - "8080"
    networks:
      - web_internal

networks:
  public_edge: {}
  web_internal:
    internal: true

volumes:
  caddy_data: {}
  caddy_config: {}
